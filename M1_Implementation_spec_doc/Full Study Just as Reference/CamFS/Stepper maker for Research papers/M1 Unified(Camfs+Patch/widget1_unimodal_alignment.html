        </div>

        <div class="card-title">Evidence-Weighted Aggregation</div>
        <p class="muted">Hospital 2 uploads its updated encoders and local prototypes to the server. The server aggregates updates gated by $R_{\\text{send}}$ and $R_{\\text{recv}}$ policy matrices.</p>
        
        $$ \\theta_{E_{\\text{T1}}}^{t+1} = \\sum_{j:\\, R_{\\text{send}}(j,\\text{T1})=1} \\frac{n_j}{N_{\\text{T1}}} \\theta_{E_{\\text{T1}}, j}^t $$

        <div class="math-block">
          <strong>EVIDENCE-WEIGHTED PROTOTYPE AGGREGATION (Class $c=1$ [NCR/NET]):</strong><br>
          $$ \\text{Proto}_{\\text{T1}}^{c=1, t+1} = \\sum_j \\left[ \\frac{|P_{\\text{T1}, j}^{c=1}|}{\\sum_k |P_{\\text{T1}, k}^{c=1}|} \\right] \\text{Proto}_{\\text{T1}, j}^{c=1, t} $$
          For Hospital 2: $|P_{\\text{T1}, 2}^{c=1}| = 30$ points out of Total 100 points across federation:<br>
          $$\\text{Weight}_{H2} = \\frac{30}{100} = 30.0\\% \\text{ contribution to } \\text{Proto}_{\\text{T1}}^{c=1}$$
        </div>

        <div class="highlight-green">
          <strong>Server Update Complete:</strong> Global prototype bank updated and ready for prototype drift evaluation.
        </div>
      </div>
    `
  },
  {
    title: "Phase 1 Round Completion & State Output",
    body: `
      <div class="card">
        <div class="intro-box">
          <div class="intro-title">Intuition & Metric Intro</div>
          What is Prototype Drift? $\\text{Drift}_t$ measures how much global class prototype vectors change from round $t-1$ to round $t$ across all 4 modalities and 4 ground-truth classes $[c=0 \\text{ (BG)}, c=1 \\text{ (NCR)}, c=2 \\text{ (ED)}, c=4 \\text{ (ET)}]$. High drift means representations are still shifting; low drift ($\text{Drift}_t < \\epsilon = 0.0100$) means unimodal encoders have stabilized and are ready to be frozen permanently!
        </div>

        <div class="card-title">Phase Controller Drift Evaluation</div>
        <p class="muted">At the end of Round $t=25$, the Phase Controller evaluates global prototype drift across all 4 modalities and 4 ground-truth classes.</p>
        
        $$ \\text{Drift}_t = \\frac{1}{4 C_{\\text{cls}}} \\sum_{m \\in \\mathcal{M}} \\sum_{c \\in \\{0,1,2,4\\}} \\left\| \\text{Proto}_m^{c, t} - \\text{Proto}_m^{c, t-1} \\right\|_2 $$

        <div class="math-block">
          <strong>DRIFT COMPUTATION AT ROUND $t=25$:</strong><br>
          $$\\text{Drift}_{25} = 0.0084$$
          $$\\text{Threshold } \\epsilon = 0.0100$$
          $$\\text{Status: } \\text{Drift}_{25} < \\epsilon \\quad (\\text{Condition met for 3rd consecutive round } K=3)$$
        </div>

        <div class="highlight-green">
          <strong>PHASE 1 COMPLETE:</strong> Phase Controller triggers the 5-step Freeze Procedure (Widget 2) to lock unimodal encoders permanently.
        </div>
      </div>
    `
  }
];

let cur = 0;
const N = steps.length;

function renderLaTeX() {
  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('step-body'), {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      ignoredTags: ["script", "noscript", "style", "textarea"],
      throwOnError: false
    });
  }
}

function render() {
  document.getElementById('step-num').textContent = `Step ${cur+1} / ${N}`;
  document.getElementById('step-title').textContent = steps[cur].title;
  document.getElementById('step-body').innerHTML = steps[cur].body;
  document.getElementById('prev-btn').disabled = cur === 0;
  document.getElementById('next-btn').disabled = cur === N-1;
  
  const prog = document.getElementById('progress');
  prog.innerHTML = '';
  for (let i = 0; i < N; i++) {
    const p = document.createElement('div');
    p.className = 'pip' + (i < cur ? ' done' : '') + (i === cur ? ' active' : '');
    p.onclick = () => { cur = i; render(); };
    prog.appendChild(p);
  }

  renderLaTeX();
}

function move(d) {
  cur = Math.max(0, Math.min(N-1, cur+d));
  render();
  document.querySelector('.stepper').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

render();
</script>

</body>
</html>
