<style>

        </div>
      </div>
    `

  {

        $$ \\mathcal{L}_2^{\\text{Phase 2}} = \\mathcal{L}_{\\text{task}}(y, \\hat{y}_{S_2'}) + \\lambda_2 \\mathcal{L}_{\\text{fusion-align}}(z_{S_2'}) $$

        <div class="math-block">
          <strong>GRADIENT BACKPROPAGATION DESTINATIONS:</strong><br>
          • $\\frac{\\partial \\mathcal{L}}{\\partial \\theta_{F_{S_2'}}}$ &nbsp;&nbsp;: <strong>UPDATED</strong> &nbsp;(Norm = $1.42$ — Public Track Fusion Head)<br>
          • $\\frac{\\partial \\mathcal{L}}{\\partial \\theta_{D_{S_2'}}}$ &nbsp;&nbsp;: <strong>UPDATED</strong> &nbsp;(Norm = $1.85$ — Public Track Decoder)<br>
          • $\\frac{\\partial \\mathcal{L}}{\\partial \\theta_{E_m}^*}$ &nbsp;&nbsp;: <strong>0.000000</strong> &nbsp;<span style="color: var(--pip-active); font-weight: 600;">(Blocked by detach() wall)</span>

          <strong>Clean Separation:</strong> Public track parameters update cleanly without touching frozen unimodal encoders.

    body: `
      <div class="card">

          When Hospital 2 uploads model deltas to the server, the client-side gateway enforces the Send-Gated Track Filter $R_{\\text{send}}^{\\text{track}}(2, S')$. Only deltas for Track $S_2' = \\{\\text{T1, T2}\\}$ are transmitted. Private local head deltas are blocked locally.
        </div>

        <div class="card-title">Hospital 2 Transmission Payload Audit</div>
        <p class="muted">Client-side governance filter checks outgoing parameter payload.</p>

        <div class="math-block">
          <strong>OUTGOING TRANSMISSION PAYLOAD CHECK:</strong><br>

          • Private Local Head Deltas $(\\Delta \\theta_{\\text{local}})$ : <code>BLOCKED LOCALLY</code> &nbsp;($R_{\\text{send}}^{\\text{track}} = 0$)<br>

          <strong>Auditable Transmission:</strong> The server receives strictly Track $S_2'$ fusion parameters containing zero $\\text{T1ce}$ signal.

          • The server aggregates updates from BOTH hospitals to produce the updated global Track $S_2' = \{\text{T1, T2}\}$ model!
        </div>

        <div class="card-title">Federated Aggregation Equation for Track $S_2' = \{\text{T1, T2}\}$</div>
        <p class="muted">The server computes sample-weighted FedAvg across all hospitals contributing to Track $S_2'$:</p>

        $$ \\theta_{\\text{FusionHead}_{S_2'}}^{t+1} = \\frac{n_2}{n_2 + n_4} \\theta_{F_{S_2'}, 2}^t + \\frac{n_4}{n_2 + n_4} \\theta_{F_{S_2'}, 4}^t $$

let cur = 0;
const N = steps.length;

function renderLaTeX() {
  if (window.renderMathInElement) {
    try {
      renderMathInElement(document.getElementById('step-body'), {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        ignoredTags: ["script", "noscript", "style", "textarea"],
        throwOnError: false
      });
    } catch(e) {
      console.warn("KaTeX render notice:", e);
    }
  }
}

function render() {
  document.getElementById('step-num').textContent = `Step ${cur+1} / ${N}`;
  document.getElementById('step-title').textContent = steps[cur].title;
  document.getElementById('step-body').innerHTML = steps[cur].body;
  document.getElementById('prev-btn').disabled = cur === 0;
  document.getElementById('next-btn').disabled = cur === N-1;
  
  const prog = document.getElementById('progress');
  prog.innerHTML = '';
  for (let i = 0; i < N; i++) {
    const p = document.createElement('div');
    p.className = 'pip' + (i < cur ? ' done' : '') + (i === cur ? ' active' : '');
    p.onclick = () => { cur = i; render(); };
    prog.appendChild(p);
  }

  renderLaTeX();
}

function move(d) {
  cur = Math.max(0, Math.min(N-1, cur+d));
  render();
  document.querySelector('.stepper').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

render();
</script>

</body>
</html>
