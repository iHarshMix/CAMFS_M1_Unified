<style>

      --green-bg: #064e3b; --green-text: #a7f3d0; --green-border: #059669;

<body>

<div class="stepper">

    </div>
    <div class="btn-group">

    </div>
  </div>

  <div id="step-body"></div>
</div>

<script>
const steps = [
  {
    title: "Prototype Drift Convergence & Phase 1 Termination",
    body: `
      <div class="card">
        <div class="intro-box">
          <div class="intro-title">Intuition & Purpose</div>
          How does the system know Phase 1 is complete? Rather than using arbitrary human epoch counts, the Phase Controller automatically monitors global prototype stability. When global prototype drift drops below $\\epsilon = 0.0100$ for $K=3$ consecutive rounds, unimodal encoders are declared fully stabilized.
        </div>

        <div class="card-title">Phase Controller Convergence Trigger (Round t=25)</div>
        <p class="muted">At the end of Round $t=25$, the Phase Controller calculates the global L2 prototype drift metric across all 4 modalities and 4 ground-truth classes $[c=0 \\text{ (BG)}, c=1 \\text{ (NCR)}, c=2 \\text{ (ED)}, c=4 \\text{ (ET)}]$.</p>

        $$ \\text{Drift}_t = \\frac{1}{4 C_{\\text{cls}}} \\sum_{m \\in \\mathcal{M}} \\sum_{c \\in \\{0,1,2,4\\}} \\left\\| \\text{Proto}_m^{c, t} - \\text{Proto}_m^{c, t-1} \\right\\|_2 $$

        <div class="math-block">
          <strong>CONVERGENCE EVALUATION LOG:</strong><br>
          • Round $t=23$: $\\text{Drift}_{23} = 0.0092 < 0.0100$ &nbsp;($K=1$ consecutive round)<br>
          • Round $t=24$: $\\text{Drift}_{24} = 0.0088 < 0.0100$ &nbsp;($K=2$ consecutive rounds)<br>
          • Round $t=25$: $\\text{Drift}_{25} = 0.0084 < 0.0100$ &nbsp;($K=3$ consecutive rounds — <strong>THRESHOLD MET!</strong>)
        </div>

        <div class="highlight-green">
          <strong>Phase 1 Terminated:</strong> Unimodal feature representation spaces $\\mathbb{R}^{256}$ are fully stabilized. The server halts Phase 1 training and initiates the 5-Step Freeze Procedure.
        </div>
      </div>
    `
  },
  {
    title: "Step 1 of Freeze: Global Prototype Bank Snapshot & Export",
    body: `
      <div class="card">
        <div class="intro-box">
          <div class="intro-title">Server Level vs. Restricted Client Local Level</div>
          <strong>What happens to restricted modalities (like Hospital 2's T1ce)?</strong><br>

          2. <strong>Restricted Client Level (Hospital 2):</strong> Hospital 2 downloaded global T1ce prototypes to align its <em>local</em> $\\text{Encoder}_{\\text{T1ce}}$, but <strong>never uploaded</strong> its T1ce encoder or prototypes ($R_{\\text{send}}(2, \\text{T1ce}) = 0$). At Freeze, Hospital 2 locks its local $\\text{Encoder}_{\\text{T1ce}}$ into static weights $\\theta_{E_{\\text{T1ce}}, 2}^*$ for its <strong>Private Local Head</strong>!
        </div>

        <div class="card-title">Exporting the $4 \\times 4 = 16$ Static Prototype Bank</div>
        <p class="muted">The server locks the final converged prototype vectors for all 4 modalities and 4 ground-truth classes into a static read-only bank $\\text{Proto}_m^{*, c}$.</p>

        <div class="math-block">
          <strong>EXPORTED STATIC PROTOTYPE BANK MATRIX (16 Vectors in $\\mathbb{R}^{256}$):</strong><br>
          • $\\text{Proto}_{\\text{T1}}^{*, c} \\in \\mathbb{R}^{256}$ for classes $[c=0 \\text{ (BG)}, c=1 \\text{ (NCR)}, c=2 \\text{ (ED)}, c=4 \\text{ (ET)}]$ &nbsp;<span class="muted">(From H1, H2, H4)</span><br>
          • $\\text{Proto}_{\\text{T1ce}}^{*, c} \\in \\mathbb{R}^{256}$ for classes $[c=0 \\text{ (BG)}, c=1 \\text{ (NCR)}, c=2 \\text{ (ED)}, c=4 \\text{ (ET)}]$ &nbsp;<span class="muted">(From H1, H4 — H2 Restricted)</span><br>
          • $\\text{Proto}_{\\text{T2}}^{*, c} \\in \\mathbb{R}^{256}$ for classes $[c=0 \\text{ (BG)}, c=1 \\text{ (NCR)}, c=2 \\text{ (ED)}, c=4 \\text{ (ET)}]$ &nbsp;<span class="muted">(From H1, H2, H4)</span><br>
          • $\\text{Proto}_{\\text{FLAIR}}^{*, c} \\in \\mathbb{R}^{256}$ for classes $[c=0 \\text{ (BG)}, c=1 \\text{ (NCR)}, c=2 \\text{ (ED)}, c=4 \\text{ (ET)}]$ &nbsp;<span class="muted">(From H1, H3)</span>
        </div>

        <div class="highlight-box">
          <strong>Immutable Reference & Local Privacy:</strong> The global server locks 16 prototype vectors. Meanwhile, Hospital 2 freezes its local $\\text{Encoder}_{\\text{T1ce}}$ privately for local clinical use without sending 1 byte of T1ce parameter delta to the server.
        </div>
      </div>
    `
  },
  {
    title: "Step 2 of Freeze: Unimodal Parameter Locking (requires_grad = False)",
    body: `
      <div class="card">
        <div class="intro-box">
          <div class="intro-title">Intuition & Purpose</div>
          Why freeze parameter weights? If unimodal encoders continued updating during Phase 2, task segmentation loss from multi-modal clients would backpropagate into unimodal encoders, causing un-consented modality signals to bleed across clients (Flaw 8). Setting <code>requires_grad = False</code> locks encoder parameters permanently.
        </div>

        <div class="card-title">Parameter Weight Locking (PyTorch Level)</div>
        <p class="muted">All unimodal encoder parameters $\\theta_{E_m}$ across all hospitals are frozen into static, immutable weights $\\theta_{E_m}^*$.</p>

        <div class="math-block">
          <strong>ENCODER PARAMETER GRADIENT STATUS AT HOSPITAL 2:</strong><br>
          • $\\theta_{E_{\\text{T1}}}^* \\implies$ <code>requires_grad = False</code> &nbsp;<span style="color: var(--pip-active); font-weight: 600;">(LOCKED — Public Track S2')</span><br>
          • $\\theta_{E_{\\text{T1ce}}}^* \\implies$ <code>requires_grad = False</code> &nbsp;<span style="color: var(--amber-text); font-weight: 600;">(LOCKED — Private Local Head Only)</span><br>
          • $\\theta_{E_{\\text{T2}}}^* \\implies$ <code>requires_grad = False</code> &nbsp;<span style="color: var(--pip-active); font-weight: 600;">(LOCKED — Public Track S2')</span><br>
          • $\\theta_{E_{\\text{FLAIR}}}^* \\implies$ <code>IDLE / Unused</code> &nbsp;<span style="color: var(--red-text); font-weight: 600;">(Missing Modality)</span>
        </div>

        <div class="highlight-green">
          <strong>Weight Isolation:</strong> Unimodal encoders will receive 0 gradient updates for the remainder of the federation's lifecycle.
        </div>
      </div>
    `
  },
  {
    title: "Step 3 of Freeze: Computation Graph detach() Wall Insertion",
    body: `
      <div class="card">
        <div class="intro-box">
          <div class="intro-title">Intuition & Purpose</div>
          Why is <code>requires_grad = False</code> not enough? Weight locking prevents weight mutation, but auto-differentiation graph nodes can still pass gradient tensors backward through intermediate activations! By inserting an explicit <code>detach()</code> operator $z_m = \\text{detach}(\\text{Encoder}_m^*(x_m))$, we destroy the backpropagation graph edge entirely, creating a structural stop-gradient wall!
        </div>

        <div class="card-title">Graph-Level Stop-Gradient Wall Insertion</div>
        <p class="muted">The computation graph is transformed so bottleneck embeddings $z_m$ become leaf tensors with no gradient history.</p>

        $$ z_m^{\\text{Phase 2}} = \\text{detach}\\left( \\text{Encoder}_m^*(x_m) \\right) $$

        <div class="math-block">
          <strong>COMPUTATION GRAPH OPERATOR DIAGRAM:</strong><br>
          Raw MRI $x_m \\to \\text{Encoder}_m^* \\to \\tilde{z}_m \\to \\mathbf{\\text{detach}()} \\to \\mathbf{z_m \\in \\mathbb{R}^{256 \\times 15 \\times 15}}$<br><br>
          • Tensor Property: $z_m.\\text{grad\\_fn} = \\mathbf{\\text{None}}$<br>
          • Partial Derivative: $\\frac{\\partial z_m}{\\partial \\theta_{E_m}^*} \\equiv \\mathbf{0.00}$ &nbsp;(Architectural Zero)
        </div>

        <div class="highlight-warn">
          <strong>The Stop-Gradient Wall:</strong> Any gradient flowing back from Phase 2 fusion heads or decoders hits the <code>detach()</code> operator and immediately terminates. It is mathematically impossible for gradients to reach $\\theta_{E_m}^*$!
        </div>
      </div>
    `
  },
  {
    title: "Step 4 of Freeze: Lineage Tagging & Provenance Registration",
    body: `
      <div class="card">
        <div class="intro-box">
          <div class="intro-title">Intuition & Purpose</div>
          How do we prove compliance to legal/IRB auditors? Every parameter in the federation is registered in the server's <strong>Provenance Ledger</strong> with an explicit modality lineage tag $\\text{Lineage}(\\theta)$. Unimodal encoders are tagged with strictly 1 modality, proving zero cross-modal contamination.
        </div>

        <div class="card-title">Server Provenance Ledger Registration</div>
        <p class="muted">The server registers the immutable parameter lineage for each frozen encoder in the federation vault.</p>

        <div class="math-block">
          <strong>REGISTERED PARAMETER LINEAGE SETS AT SERVER:</strong><br>
          • $\\text{Lineage}(\\theta_{E_{\\text{T1}}}^*) = \\{\\text{T1}\\}$ &nbsp;<span class="muted">(Contains ONLY T1 signal)</span><br>
          • $\\text{Lineage}(\\theta_{E_{\\text{T1ce}}}^*) = \\{\\text{T1ce}\\}$ &nbsp;<span class="muted">(Contains ONLY T1ce signal — uploaded by H1, H4)</span><br>
          • $\\text{Lineage}(\\theta_{E_{\\text{T2}}}^*) = \\{\\text{T2}\\}$ &nbsp;<span class="muted">(Contains ONLY T2 signal)</span><br>
          • $\\text{Lineage}(\\theta_{E_{\\text{FLAIR}}}^*) = \\{\\text{FLAIR}\\}$ &nbsp;<span class="muted">(Contains ONLY FLAIR signal)</span>
        </div>

        <div class="highlight-box">
          <strong>Auditable Lineage Invariant:</strong> $|\\text{Lineage}(\\theta_{E_m}^*)| = 1$. Each unimodal encoder is certified 100% pure.
        </div>
      </div>
    `
  },
  {
    title: "Step 5 of Freeze: Phase Controller State Machine Transition",
    body: `
      <div class="card">
        <div class="intro-box">
          <div class="intro-title">Intuition & Purpose</div>
          Completing the state machine transition. The Phase Controller updates the global federation state flag from Phase 1 to Phase 2, unlocking Track Fusion Heads ($\\text{FusionHead}_{S'}$) and decoders ($\\text{Decoder}_{S'}$) across all participating hospitals.
        </div>

        <div class="card-title">Federated State Machine Transition</div>
        <p class="muted">The central coordinator broadcasts the state transition signal across the network.</p>

        <div class="math-block">
          <strong>STATE TRANSITION EVENT LOG:</strong><br>
          $$\\text{State}_{\\text{FL}} : \\text{PHASE 1 (Unimodal Alignment)} \\implies \\mathbf{\\text{PHASE 2 (Track-Isolated Fusion Training)}}$$
          • Modality Masking: DEACTIVATED for owned modalities in active tracks.<br>
          • Unimodal Encoder Backprop: PERMANENTLY DISABLED.<br>
          • Task Segmentation Loss $\\mathcal{L}_{\\text{task}}$: ACTIVATED.
        </div>

        <div class="highlight-green">
          <strong>Phase Transition Complete:</strong> All hospitals transition simultaneously into Phase 2 Track-Isolated Fusion Training!
        </div>
      </div>
    `
  },
  {
    title: "Verification of the detach() Wall during Backpropagation",
    body: `
      <div class="card">
        <div class="intro-box">
          <div class="intro-title">Intuition & Proof</div>
          Let's prove the Zero-Leakage Guarantee mathematically. What happens when Hospital 1 (which owns T1ce) trains its Phase 2 segmentation decoder? We apply the multivariate chain rule to evaluate the gradient of task loss $\\mathcal{L}_{\\text{task}}$ with respect to frozen encoder parameters $\\theta_{E_{\\text{T1}}}^*$.
        </div>

        <div class="card-title">Mathematical Proof of Zero Gradient Leakage</div>
        <p class="muted">Expanding backpropagation via the chain rule through the <code>detach()</code> stop-gradient wall:</p>

        $$ \\frac{\\partial \\mathcal{L}_{\\text{task}}}{\\partial \\theta_{E_{\\text{T1}}}^*} = \\frac{\\partial \\mathcal{L}_{\\text{task}}}{\\partial z_{\\text{T1}}} \\cdot \\frac{\\partial z_{\\text{T1}}}{\\partial \\theta_{E_{\\text{T1}}}^*} $$

        <div class="math-block">
          <strong>EVALUATING THE CHAIN RULE TERMS:</strong><br>
          1. Task Loss Gradient to Embedding: $\\frac{\\partial \\mathcal{L}_{\\text{task}}}{\\partial z_{\\text{T1}}} = \\mathbf{\\delta \\neq 0}$ &nbsp;(Non-zero fusion tensor signal)<br>
          2. Embedding Gradient to Frozen Weights: $\\frac{\\partial z_{\\text{T1}}}{\\partial \\theta_{E_{\\text{T1}}}^*} = \\mathbf{0.00}$ &nbsp;<span style="color: var(--pip-active); font-weight: 600;">(Graph detach() operator forces 0)</span><br><br>
          $$\\text{Final Gradient: } \\frac{\\partial \\mathcal{L}_{\\text{task}}}{\\partial \\theta_{E_{\\text{T1}}}^*} = \\delta \\cdot 0.00 \\equiv \\mathbf{0.000000}$$
        </div>

        <div class="highlight-green">

        </div>

    `

    title: "Phase 2 Initialization & Track Fusion Head Setup",

        <div class="intro-box">
          <div class="intro-title">Intuition & Purpose</div>

        <p class="muted">Hospital 2 (owns T1, T1ce, T2; sends T1, T2) initializes its Phase 2 track layout:</p>

        <div class="math-block">

          • <strong>Frozen Embeddings:</strong> $z_{\\text{T1}}, z_{\\text{T1ce}}, z_{\\text{T2}} \\in \\mathbb{R}^{256 \\times 15 \\times 15}$ &nbsp;<span class="muted">(Static Leaf Tensors)</span><br>

        </div>
      </div>
    `
  }

let cur = 0;
const N = steps.length;

function renderLaTeX() {
  if (window.renderMathInElement) {
    try {
      renderMathInElement(document.getElementById('step-body'), {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        ignoredTags: ["script", "noscript", "style", "textarea"],
        throwOnError: false
      });
    } catch(e) {
      console.warn("KaTeX render notice:", e);
    }
  }
}

function render() {
  document.getElementById('step-num').textContent = `Step ${cur+1} / ${N}`;
  document.getElementById('step-title').textContent = steps[cur].title;
  document.getElementById('step-body').innerHTML = steps[cur].body;
  document.getElementById('prev-btn').disabled = cur === 0;
  document.getElementById('next-btn').disabled = cur === N-1;
  
  const prog = document.getElementById('progress');
  prog.innerHTML = '';
  for (let i = 0; i < N; i++) {
    const p = document.createElement('div');
    p.className = 'pip' + (i < cur ? ' done' : '') + (i === cur ? ' active' : '');
    p.onclick = () => { cur = i; render(); };
    prog.appendChild(p);
  }

  renderLaTeX();
}

function move(d) {
  cur = Math.max(0, Math.min(N-1, cur+d));
  render();
  document.querySelector('.stepper').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

render();
</script>

</body>
</html>
