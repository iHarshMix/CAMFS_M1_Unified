# configs/ablations/a5_cold_start.yaml
# Ablation A5: Cold-start variants for H4 delayed S4 track (§10)
# Spec §14.3/§10: Compare three fully specified variants:
#   Tier 1 — Subset growth: canonical S2→S4 widening from frozen S2 checkpoint
#   Tier 2 — Track-local warm start: fresh Kaiming init + 10 warm-start alignment rounds
#   Tier 3 — Fresh task training: fresh Kaiming init, begin task+alignment immediately
_base_: "../default.yaml"
experiment:
  name: "ablation_a5_cold_start"
ablation:
  id: "A5_ColdStart"
  tiers: [1, 2, 3]
  tier2_warmstart_rounds: 10
  description: "Cold-start: compare 3 H4 S4 initialization strategies"
